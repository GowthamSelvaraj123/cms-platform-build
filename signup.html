<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-gray-100 flex items-center justify-center">

    <!-- Sign Up Card -->
    <div class="w-full max-w-md bg-white rounded-2xl shadow-lg p-8 mx-4">

        <!-- Heading -->
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-gray-800">
                Create Account
            </h1>

            <p class="text-gray-500 mt-2">
                Sign up to get started
            </p>
        </div>

        <!-- Sign Up Form -->
        <form>

            <!-- Full Name -->
            <div class="mb-5">
                <label for="name" class="block text-sm font-medium text-gray-700 mb-2">
                    Full Name
                </label>

                <input type="text" id="name" name="name" placeholder="Enter your full name" required class="w-full px-4 py-3 border border-gray-300 rounded-lg
                           focus:outline-none focus:ring-2 focus:ring-blue-500
                           focus:border-blue-500">
            </div>

            <!-- Email -->
            <div class="mb-5">
                <label for="email" class="block text-sm font-medium text-gray-700 mb-2">
                    Email Address
                </label>

                <input type="email" id="email" name="email" placeholder="Enter your email" required class="w-full px-4 py-3 border border-gray-300 rounded-lg
                           focus:outline-none focus:ring-2 focus:ring-blue-500
                           focus:border-blue-500">
            </div>

            <!-- Password -->
            <div class="mb-5">
                <label for="password" class="block text-sm font-medium text-gray-700 mb-2">
                    Password
                </label>

                <input type="password" id="password" name="password" placeholder="Create a password" required class="w-full px-4 py-3 border border-gray-300 rounded-lg
                           focus:outline-none focus:ring-2 focus:ring-blue-500
                           focus:border-blue-500">
            </div>

            <!-- Confirm Password -->
            <div class="mb-5">
                <label for="confirm-password" class="block text-sm font-medium text-gray-700 mb-2">
                    Confirm Password
                </label>

                <input type="password" id="confirm-password" name="confirm-password" placeholder="Confirm your password"
                    required class="w-full px-4 py-3 border border-gray-300 rounded-lg
                           focus:outline-none focus:ring-2 focus:ring-blue-500
                           focus:border-blue-500">
            </div>

            <!-- Terms -->
            <div class="flex items-start gap-2 mb-6">
                <input type="checkbox" id="terms" required class="w-4 h-4 mt-1 text-blue-600 rounded">

                <label for="terms" class="text-sm text-gray-600">
                    I agree to the
                    <a href="#" class="text-blue-600 hover:text-blue-800">
                        Terms & Conditions
                    </a>
                </label>
            </div>

            <!-- Sign Up Button -->
            <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded-lg
                       font-semibold hover:bg-blue-700
                       transition duration-200">
                Create Account
            </button>

        </form>

        <!-- Login Link -->
        <p class="text-center text-sm text-gray-600 mt-6">
            Already have an account?
            <a href="login.html" class="text-blue-600 font-semibold hover:text-blue-800">
                Login
            </a>
        </p>

    </div>

</body>

</html>
